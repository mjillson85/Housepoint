# Tries the services behind "Thinking of buying?" (tests/probe/services.mjs) and other states' parcel services
# (tests/probe/states.mjs, state-fields.mjs, live-state.mjs) from a browser on GitHub, and logs the answers.
# Runs when the probe changes, or by hand from the Actions tab. Nothing is saved or committed.
name: probe services
on:
  push:
    branches: [main]
    paths: ['tests/probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test tools
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Probe
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/services.mjs
      # Run by hand when needed: probe/states.mjs (which states have free parcel services), probe/state-fields.mjs (a new state's
      # fields and use codes), probe/nc-tax-rates.py and probe/wa-tax-rates.py (North Carolina's and Washington's tax rate tables;
      # need pip install openpyxl), probe/wi-speed.mjs (Wisconsin lot query timings), probe/mn-codes.mjs (Minnesota's numbered property classes), probe/md-speed.mjs (Maryland's parcel sources timed), probe/dc-condos.mjs (DC's condo tables), probe/md-records.mjs (Maryland's records),
      # probe/ny-records.mjs (New York's records), probe/borders.mjs (the Census Bureau's state lines; plain Node),
      # probe/outlines.mjs (Census outlines of new states), probe/utah-services.mjs (Utah's county parcel services).
      - name: The Tier 2 services' other layers and tables
        working-directory: tests
        continue-on-error: true
        run: node probe/layers.mjs
      - name: The slow Tier 2 layers timed
        working-directory: tests
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/tier2-speed.mjs
      - name: The next states' fields and property types
        working-directory: tests
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/state-fields.mjs
      - name: The newest state against its real service
        working-directory: tests
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/live-state.mjs
