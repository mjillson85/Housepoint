# Tries the services behind "Thinking of buying?" (tests/probe/services.mjs) and other states' parcel services
# (tests/probe/states.mjs, state-fields.mjs) from a browser on GitHub, and logs the answers.
# Runs when the probe changes, or by hand from the Actions tab. Nothing is saved or committed.
name: probe services
on:
  push:
    branches: [main]
    paths: ['tests/probe/**', '.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test tools
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Probe
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/services.mjs
      # probe/states.mjs (which states have free parcel services) is run by hand when needed.
      - name: Probe the next state's fields and property types
        working-directory: tests
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: node probe/state-fields.mjs
