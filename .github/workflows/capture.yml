# Captures real parcel records from the covered states' public services into tests/fixtures/ (see tests/capture/capture.mjs),
# and commits them. Runs when the capture script changes, or by hand from the Actions tab ("Run workflow") to refresh them.
# The normal tests never touch the network; they read these files.
name: capture real records
on:
  push:
    branches: [main]
    paths: ['tests/capture/**', '.github/workflows/capture.yml']
  workflow_dispatch:
    inputs:
      states:
        description: 'States to capture, e.g. "NC" (empty: all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency: { group: capture, cancel-in-progress: false }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test tools
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Capture
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
          # A push captures only states without records yet; "Run workflow" with no states refreshes them all.
          # Passed through the environment, never pasted into the script, and only region ids get through.
          STATES: ${{ github.event_name == 'push' && 'new' || github.event.inputs.states }}
        run: |
          case "$STATES" in *[!A-Za-z_\ ,]*) echo "states must be region ids like NC or TX_HARRIS"; exit 1;; esac
          node capture/capture.mjs $STATES
      # A push made with this workflow's token doesn't start the tests workflow, so the new records are tested here, before they're
      # committed: the real-record test (owner fields included) and the owner-field check.
      - name: Test the new records
        id: test
        if: always()
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
        run: node test_real.mjs && node test_owner.mjs
      - name: Commit the records
        if: always() && steps.test.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The new capture wins: start from the latest main (another run may have pushed meanwhile) and put these files on it
          mkdir -p /tmp/fx && cp tests/fixtures/*.json /tmp/fx/
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/fx/*.json tests/fixtures/ && git add tests/fixtures
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "Refresh real-record test fixtures" && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
