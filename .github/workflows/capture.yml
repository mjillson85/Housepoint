# Captures real parcel records from the four states' public services into tests/fixtures/ (see tests/capture/capture.mjs),
# and commits them. Runs when the capture script changes, or by hand from the Actions tab ("Run workflow") to refresh them.
# The normal tests never touch the network; they read these files.
name: capture real records
on:
  push:
    branches: [main]
    paths: ['tests/capture/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: capture, cancel-in-progress: false }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test tools
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Capture
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
        run: node capture/capture.mjs
      - name: Commit the records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Refresh real-record test fixtures"
          git pull --rebase origin main
          git push origin HEAD:main
